<!DOCTYPE html>
<html lang="en">
<head>
    <title>CV-EFFECTS — Fill-Extrusion Layer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CV-EFFECTS testbed for fill-extrusion (3D building) layers. Demonstrates drop shadow, outer glow, and inner glow on NYC buildings from OpenFreeMap planet tiles.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="../../dist/maplibre-gl.css">
    <script src="../../dist/maplibre-gl-dev.js"></script>
</head>
<body>
<!--
  CV-EFFECTS: Fill-Extrusion Layer — supported paint properties
  =============================================================
  cv-blend-mode              enum   "normal" | "multiply" | "screen" | "add" | "lighten" | "overlay" | "hardlight"
  cv-shadow-enabled          bool
  cv-shadow-color            color
  cv-shadow-opacity          0-1
  cv-shadow-size             px     blur radius
  cv-shadow-strength         0-10   alpha multiplier (1.0 = 100%)
  cv-shadow-distance         px
  cv-shadow-angle            deg
  cv-outer-glow-enabled      bool
  cv-outer-glow-color        color
  cv-outer-glow-opacity      0-1
  cv-outer-glow-size         px
  cv-outer-glow-strength     0-10
  cv-inner-glow-enabled      bool
  cv-inner-glow-color        color
  cv-inner-glow-opacity      0-1
  cv-inner-glow-size         px
  cv-inner-glow-strength     0-10
  cv-hover-shadow-enabled    bool   (requires cv-pickable — future)
  cv-hover-shadow-color      color
  cv-hover-shadow-opacity    0-1
  cv-hover-shadow-size       px
  cv-hover-shadow-strength   0-10
  cv-hover-highlight-color   color

  NOTE: Effects are applied after 3D projection — depth ordering is preserved.
        cv-fill-gradient-* is NOT supported (fill only).
  Data: OpenFreeMap planet vector tiles, "building" source-layer (NYC, zoom 15.5)
  Basemap: HERE Maps Road Lite
-->
<script type="module">
import { injectStyles, buildShell, initLayers, addFpsCounter, addBaselineToggle } from './cv-effects-controls.js';

injectStyles();
buildShell();

const map = new maplibregl.Map({
    container: 'cv-map',
    style: {
        version: 8,
        sources: {
            'here-basemap': {
                type: 'raster',
                tiles: ['https://maps.hereapi.com/v3/base/mc/{z}/{x}/{y}/png?style=lite.day&lang=en&apiKey=8P_kbNDELB6ADBwC9oCoLd3Gd_C0gnan8TCvoNT1Wfg'],
                tileSize: 256,
            },
        },
        layers: [
            { id: 'background', type: 'background', paint: { 'background-color': '#e8e4dc' } },
            { id: 'here-basemap', type: 'raster', source: 'here-basemap', paint: { 'cv-blend-mode': 'normal' } },
        ],
    },
    center: [-74.0066, 40.7135],
    zoom: 15.5,
    pitch: 45,
    bearing: -17.6,
    canvasContextAttributes: { antialias: true },
});

map.on('load', () => {
    map.addSource('ofm', {
        url:  'https://tiles.openfreemap.org/planet',
        type: 'vector',
    });

    map.addLayer({
        id:           'buildings-extrusion',
        source:       'ofm',
        'source-layer': 'building',
        type:         'fill-extrusion',
        minzoom:      14,
        filter:       ['!=', ['get', 'hide_3d'], true],
        paint: {
            'fill-extrusion-color': [
                'interpolate', ['linear'], ['get', 'render_height'],
                0,   '#1e293b',
                100, '#3b82f6',
                300, '#60a5fa',
            ],
            'fill-extrusion-height': [
                'interpolate', ['linear'], ['zoom'],
                14, 0, 15, ['get', 'render_height'],
            ],
            'fill-extrusion-base': [
                'case', ['>=', ['get', 'zoom'], 15], ['get', 'render_min_height'], 0,
            ],
            'fill-extrusion-opacity': 0.9,
            'cv-blend-mode': 'normal',
            'cv-shadow-enabled':  false,
            'cv-shadow-color':    '#000000',
            'cv-shadow-size':     10,
            'cv-shadow-distance': 5,
            'cv-shadow-angle':    45,
            'cv-shadow-opacity':  0.5,
            'cv-shadow-strength': 1.0,
            'cv-outer-glow-enabled':  true,
            'cv-outer-glow-color':    '#3b82f6',
            'cv-outer-glow-size':     10,
            'cv-outer-glow-opacity':  0.6,
            'cv-outer-glow-strength': 1.0,
            'cv-inner-glow-enabled':  false,
            'cv-inner-glow-color':    '#60a5fa',
            'cv-inner-glow-size':     5,
            'cv-inner-glow-opacity':  0.5,
            'cv-inner-glow-strength': 1.0,
        },
    });

    initLayers(map, [
        {
            id: 'buildings-extrusion',
            label: 'NYC Buildings',
            type: 'fill-extrusion',
            effects: { blend: true, shadow: true, outerGlow: true, innerGlow: true },
            defaults: {
                'cv-blend-mode':          'normal',
                'cv-shadow-enabled':       false,
                'cv-shadow-color':         '#000000',
                'cv-shadow-size':          10,
                'cv-shadow-distance':      5,
                'cv-shadow-angle':         45,
                'cv-shadow-opacity':       0.5,
                'cv-shadow-strength':      1.0,
                'cv-outer-glow-enabled':   true,
                'cv-outer-glow-color':     '#3b82f6',
                'cv-outer-glow-size':      10,
                'cv-outer-glow-opacity':   0.6,
                'cv-outer-glow-strength':  1.0,
                'cv-inner-glow-enabled':   false,
                'cv-inner-glow-color':     '#60a5fa',
                'cv-inner-glow-size':      5,
                'cv-inner-glow-opacity':   0.5,
                'cv-inner-glow-strength':  1.0,
            },
        },
        {
            id: 'here-basemap',
            label: 'HERE Road Lite (Basemap)',
            type: 'raster',
            effects: { blend: true, shadow: false, outerGlow: false, innerGlow: false },
            defaults: { 'cv-blend-mode': 'normal' },
        },
    ]);

    addFpsCounter(map);
    addBaselineToggle(map, ['buildings-extrusion']);
});
</script>
</body>
</html>
