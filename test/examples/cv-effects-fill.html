<!DOCTYPE html>
<html lang="en">
<head>
    <title>CV-EFFECTS — Fill Layer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CV-EFFECTS testbed for fill and line layers. Demonstrates drop shadow, outer glow, inner glow, and blend-mode compositing on polygon fill layers backed by US county GeoJSON.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="../../dist/maplibre-gl.css" />
    <script src="../../dist/maplibre-gl-dev.js"></script>
</head>
<body>
<!--
  CV-EFFECTS: Fill Layer — supported paint properties
  ====================================================
  cv-blend-mode                  enum   "normal" | "multiply" | "screen" | "add" | "lighten" | "overlay" | "hardlight"
  cv-shadow-enabled              bool   drop shadow on/off
  cv-shadow-color                color
  cv-shadow-opacity              0-1
  cv-shadow-size                 px     blur radius
  cv-shadow-strength             0-10   alpha multiplier (1.0 = 100%)
  cv-shadow-distance             px     offset distance
  cv-shadow-angle                deg    -180 to 180
  cv-outer-glow-enabled          bool
  cv-outer-glow-color            color
  cv-outer-glow-opacity          0-1
  cv-outer-glow-size             px
  cv-outer-glow-strength         0-10
  cv-inner-glow-enabled          bool
  cv-inner-glow-color            color
  cv-inner-glow-opacity          0-1
  cv-inner-glow-size             px
  cv-inner-glow-strength         0-10
  cv-fill-gradient-type          enum   "none" | "linear" | "radial"
  cv-fill-gradient-angle         deg
  cv-fill-gradient-start-color   color
  cv-fill-gradient-end-color     color
  cv-hover-shadow-enabled        bool   (requires cv-pickable layout property — future)
  cv-hover-shadow-color          color
  cv-hover-shadow-opacity        0-1
  cv-hover-shadow-size           px
  cv-hover-shadow-strength       0-10
  cv-hover-highlight-color       color  rgba tint over hovered feature

  Data: US counties GeoJSON (counties-us.geojson)
  Basemap: HERE Maps Road Lite (over solid background — blend mode is meaningful)
-->
<script type="module">
import { injectStyles, buildShell, initLayers, addFpsCounter, addBaselineToggle } from './cv-effects-controls.js';

injectStyles();
buildShell();

const map = new maplibregl.Map({
    container: 'cv-map',
    style: {
        version: 8,
        sources: {
            'here-basemap': {
                type: 'raster',
                tiles: ['https://maps.hereapi.com/v3/base/mc/{z}/{x}/{y}/png?style=lite.day&lang=en&apiKey=8P_kbNDELB6ADBwC9oCoLd3Gd_C0gnan8TCvoNT1Wfg'],
                tileSize: 256,
            },
        },
        layers: [
            { id: 'background', type: 'background', paint: { 'background-color': '#e8e4dc' } },
            { id: 'here-basemap', type: 'raster', source: 'here-basemap', paint: { 'cv-blend-mode': 'normal' } },
        ],
    },
    center: [-96, 38],
    zoom: 4,
});

map.on('load', () => {
    map.addSource('counties', {
        type: 'geojson',
        data: 'counties-us.geojson',
    });

    // Separate LineString source for county borders — derived from the polygon
    // rings but with shared edges de-duplicated and stitched into polylines.
    // Using a dedicated line source avoids the tile-boundary artefacts that
    // appear when a 'line' layer is applied directly to a polygon source
    // (geojson-vt closes clipped rings with tile-edge segments).
    map.addSource('county-borders', {
        type: 'geojson',
        data: 'county-borders.geojson',
    });

    map.addLayer({
        id: 'states-fill',
        type: 'fill',
        source: 'counties',
        paint: {
            'fill-color': [
                'match',
                ['%', ['to-number', ['slice', ['get', 'fips'], 0, 2]], 8],
                0, '#e05c5c',
                1, '#5b9bd5',
                2, '#5cb85c',
                3, '#9b59b6',
                4, '#e8a838',
                5, '#1abc9c',
                6, '#e67e22',
                7, '#3498db',
                '#aaaaaa',
            ],
            'fill-opacity': 1.0,
            'cv-blend-mode':          'normal',
            'cv-shadow-enabled':       true,
            'cv-shadow-color':         '#000000',
            'cv-shadow-opacity':       0.5,
            'cv-shadow-size':          9,
            'cv-shadow-strength':      1.0,
            'cv-shadow-distance':      3,
            'cv-shadow-angle':         45,
            'cv-outer-glow-enabled':   false,
            'cv-outer-glow-color':     '#000000',
            'cv-outer-glow-opacity':   1.0,
            'cv-outer-glow-size':      7,
            'cv-outer-glow-strength':  1.0,
            'cv-inner-glow-enabled':   false,
            'cv-inner-glow-color':     '#ffffff',
            'cv-inner-glow-opacity':   1.0,
            'cv-inner-glow-size':      5,
            'cv-inner-glow-strength':  1.0,
        },
    });

    // counties-line is added last so it always renders on top of the fill.
    // Uses the dedicated LineString source so tile-boundary artefacts don't appear.
    map.addLayer({
        id: 'counties-line',
        type: 'line',
        source: 'county-borders',
        paint: {
            'line-color': 'rgba(210,210,210,1)',
            'line-width': 1,
            'cv-blend-mode':          'normal',
            'cv-shadow-enabled':       false,
            'cv-shadow-color':         '#000000',
            'cv-shadow-opacity':       0.6,
            'cv-shadow-size':          6,
            'cv-shadow-strength':      1.0,
            'cv-shadow-distance':      4,
            'cv-shadow-angle':         45,
            'cv-outer-glow-enabled':   false,
            'cv-outer-glow-color':     '#ffcc00',
            'cv-outer-glow-opacity':   0.8,
            'cv-outer-glow-size':      8,
            'cv-outer-glow-strength':  1.0,
        },
    });

    initLayers(map, [
        {
            id: 'counties-line',
            label: 'County Borders (Line)',
            type: 'line',
            effects: { blend: true, shadow: true, outerGlow: true, innerGlow: false },
            defaults: {
                'cv-blend-mode':          'normal',
                'cv-shadow-enabled':       false,
                'cv-shadow-color':         '#000000',
                'cv-shadow-opacity':       0.6,
                'cv-shadow-size':          6,
                'cv-shadow-strength':      1.0,
                'cv-shadow-distance':      4,
                'cv-shadow-angle':         45,
                'cv-outer-glow-enabled':   false,
                'cv-outer-glow-color':     '#ffcc00',
                'cv-outer-glow-opacity':   0.8,
                'cv-outer-glow-size':      8,
                'cv-outer-glow-strength':  1.0,
            },
        },
        {
            id: 'states-fill',
            label: 'US Counties (Fill)',
            type: 'fill',
            effects: { blend: true, shadow: true, outerGlow: true, innerGlow: true },
            defaults: {
                'cv-blend-mode':          'normal',
                'cv-shadow-enabled':       true,
                'cv-shadow-color':         '#000000',
                'cv-shadow-opacity':       0.5,
                'cv-shadow-size':          9,
                'cv-shadow-strength':      1.0,
                'cv-shadow-distance':      3,
                'cv-shadow-angle':         45,
                'cv-outer-glow-enabled':   false,
                'cv-outer-glow-color':     '#000000',
                'cv-outer-glow-opacity':   1.0,
                'cv-outer-glow-size':      7,
                'cv-outer-glow-strength':  1.0,
                'cv-inner-glow-enabled':   false,
                'cv-inner-glow-color':     '#ffffff',
                'cv-inner-glow-opacity':   1.0,
                'cv-inner-glow-size':      5,
                'cv-inner-glow-strength':  1.0,
            },
        },
        {
            id: 'here-basemap',
            label: 'HERE Road Lite (Basemap)',
            type: 'raster',
            effects: { blend: true, shadow: false, outerGlow: false, innerGlow: false },
            defaults: { 'cv-blend-mode': 'normal' },
        },
    ]);

    addFpsCounter(map);
    addBaselineToggle(map, ['counties-line', 'states-fill']);
});
</script>
</body>
</html>
