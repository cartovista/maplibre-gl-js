<!DOCTYPE html>
<html lang="en">
<head>
    <title>CV-EFFECTS — Raster Layer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CV-EFFECTS testbed for raster layers. Demonstrates blend-mode compositing between a Sentinel-2 satellite raster and the HERE Road Lite basemap.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="../../dist/maplibre-gl.css">
    <script src="../../dist/maplibre-gl-dev.js"></script>
</head>
<body>
<!--
  CV-EFFECTS: Raster Layer — supported paint properties
  =====================================================
  cv-blend-mode   enum   "normal" | "multiply" | "screen" | "add" | "lighten" | "overlay" | "hardlight"

  NOTE: Raster layers support ONLY blend-mode compositing.
        Shadow and glow effects are not available for image tiles.
        Try "multiply" or "screen" to blend the satellite imagery against
        the HERE Road Lite basemap rendered beneath it.
  Data: Sentinel-2 cloudless 2020 satellite tiles (EOX IT Services)
  Basemap: HERE Maps Road Lite (rendered under the satellite layer)
-->
<script type="module">
import { injectStyles, buildShell, initLayers, addFpsCounter, addBaselineToggle } from './cv-effects-controls.js';

injectStyles();
buildShell();

const map = new maplibregl.Map({
    container: 'cv-map',
    style: {
        version: 8,
        sources: {
            'here-basemap': {
                type: 'raster',
                tiles: ['https://maps.hereapi.com/v3/base/mc/{z}/{x}/{y}/png?style=lite.day&lang=en&apiKey=8P_kbNDELB6ADBwC9oCoLd3Gd_C0gnan8TCvoNT1Wfg'],
                tileSize: 256,
            },
            satellite: {
                type: 'raster',
                tiles: ['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg'],
                tileSize: 256,
                attribution: '&copy; <a href="https://eox.at">EOX IT Services</a>',
            },
        },
        layers: [
            { id: 'background', type: 'background', paint: { 'background-color': '#e8e4dc' } },
            { id: 'here-basemap', type: 'raster', source: 'here-basemap', paint: { 'cv-blend-mode': 'normal' } },
            {
                id: 'satellite-raster',
                type: 'raster',
                source: 'satellite',
                paint: {
                    'raster-opacity': 1,
                    'cv-blend-mode': 'normal',
                },
            },
        ],
    },
    center: [14, 48],
    zoom: 4,
});

map.on('load', () => {
    initLayers(map, [
        {
            id: 'satellite-raster',
            label: 'Sentinel-2 Satellite',
            type: 'raster',
            effects: { blend: true, shadow: false, outerGlow: false, innerGlow: false },
            defaults: {
                'cv-blend-mode': 'normal',
            },
        },
        {
            id: 'here-basemap',
            label: 'HERE Road Lite (Basemap)',
            type: 'raster',
            effects: { blend: true, shadow: false, outerGlow: false, innerGlow: false },
            defaults: { 'cv-blend-mode': 'normal' },
        },
    ]);

    addFpsCounter(map);
    addBaselineToggle(map, ['satellite-raster']);
});
</script>
</body>
</html>
