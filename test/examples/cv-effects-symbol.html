<!DOCTYPE html>
<html lang="en">
<head>
    <title>CV-EFFECTS — Symbol Layer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CV-EFFECTS testbed for symbol layers. Demonstrates drop shadow and outer glow on earthquake magnitude text labels. Effects apply to the composited symbol atlas, not individual glyphs.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="../../dist/maplibre-gl.css">
    <script src="../../dist/maplibre-gl-dev.js"></script>
</head>
<body>
<!--
  CV-EFFECTS: Symbol Layer — supported paint properties
  =====================================================
  cv-blend-mode              enum   "normal" | "multiply" | "screen" | "add" | "lighten" | "overlay" | "hardlight"
  cv-shadow-enabled          bool
  cv-shadow-color            color
  cv-shadow-opacity          0-1
  cv-shadow-size             px     blur radius
  cv-shadow-strength         0-10   alpha multiplier (1.0 = 100%)
  cv-shadow-distance         px
  cv-shadow-angle            deg
  cv-outer-glow-enabled      bool
  cv-outer-glow-color        color
  cv-outer-glow-opacity      0-1
  cv-outer-glow-size         px
  cv-outer-glow-strength     0-10
  cv-inner-glow-enabled      bool
  cv-inner-glow-color        color
  cv-inner-glow-opacity      0-1
  cv-inner-glow-size         px
  cv-inner-glow-strength     0-10
  cv-hover-shadow-enabled    bool   (requires cv-pickable — future)
  cv-hover-shadow-color      color
  cv-hover-shadow-opacity    0-1
  cv-hover-shadow-size       px
  cv-hover-shadow-strength   0-10
  cv-hover-highlight-color   color

  NOTE: Effects apply to the full composited symbol tile, not per-glyph.
        Collision detection and placement are unaffected.
  Data: USGS earthquake dataset filtered to mag >= 4 (maplibre.org hosted)
  Basemap: HERE Maps Road Lite
-->
<script type="module">
import { injectStyles, buildShell, initLayers, addFpsCounter, addBaselineToggle } from './cv-effects-controls.js';

injectStyles();
buildShell();

const map = new maplibregl.Map({
    container: 'cv-map',
    style: {
        version: 8,
        glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
        sources: {
            'here-basemap': {
                type: 'raster',
                tiles: ['https://maps.hereapi.com/v3/base/mc/{z}/{x}/{y}/png?style=lite.day&lang=en&apiKey=8P_kbNDELB6ADBwC9oCoLd3Gd_C0gnan8TCvoNT1Wfg'],
                tileSize: 256,
            },
        },
        layers: [
            { id: 'background', type: 'background', paint: { 'background-color': '#e8e4dc' } },
            { id: 'here-basemap', type: 'raster', source: 'here-basemap', paint: { 'cv-blend-mode': 'normal' } },
        ],
    },
    center: [-120, 38],
    zoom: 3,
});

map.on('load', () => {
    map.addSource('earthquakes', {
        type: 'geojson',
        data: 'https://maplibre.org/maplibre-gl-js/docs/assets/earthquakes.geojson',
    });

    // Filter to magnitude >= 4 to avoid symbol clutter
    map.addLayer({
        id: 'quakes-symbol',
        type: 'symbol',
        source: 'earthquakes',
        filter: ['>=', ['get', 'mag'], 4],
        layout: {
            'text-field': ['concat', ['number-format', ['get', 'mag'], { 'min-fraction-digits': 1 }], 'M'],
            'text-font':  ['Open Sans Bold', 'Arial Unicode MS Bold'],
            'text-size':  12,
            'text-anchor': 'center',
        },
        paint: {
            'text-color': '#e2e8f0',
            'text-halo-color': '#0f172a',
            'text-halo-width': 1,
            'cv-blend-mode': 'normal',
            'cv-shadow-enabled':  true,
            'cv-shadow-color':    '#000000',
            'cv-shadow-size':     5,
            'cv-shadow-distance': 3,
            'cv-shadow-angle':    45,
            'cv-shadow-opacity':  0.7,
            'cv-shadow-strength': 1.0,
            'cv-outer-glow-enabled':  false,
            'cv-outer-glow-color':    '#f59e0b',
            'cv-outer-glow-size':     6,
            'cv-outer-glow-opacity':  0.9,
            'cv-outer-glow-strength': 1.0,
            'cv-inner-glow-enabled':  false,
            'cv-inner-glow-color':    '#ffffff',
            'cv-inner-glow-size':     3,
            'cv-inner-glow-opacity':  0.6,
            'cv-inner-glow-strength': 1.0,
        },
    });

    initLayers(map, [
        {
            id: 'quakes-symbol',
            label: 'Earthquakes (mag labels)',
            type: 'symbol',
            effects: { blend: true, shadow: true, outerGlow: true, innerGlow: true },
            defaults: {
                'cv-blend-mode':          'normal',
                'cv-shadow-enabled':       true,
                'cv-shadow-color':         '#000000',
                'cv-shadow-size':          5,
                'cv-shadow-distance':      3,
                'cv-shadow-angle':         45,
                'cv-shadow-opacity':       0.7,
                'cv-shadow-strength':      1.0,
                'cv-outer-glow-enabled':   false,
                'cv-outer-glow-color':     '#f59e0b',
                'cv-outer-glow-size':      6,
                'cv-outer-glow-opacity':   0.9,
                'cv-outer-glow-strength':  1.0,
                'cv-inner-glow-enabled':   false,
                'cv-inner-glow-color':     '#ffffff',
                'cv-inner-glow-size':      3,
                'cv-inner-glow-opacity':   0.6,
                'cv-inner-glow-strength':  1.0,
            },
        },
        {
            id: 'here-basemap',
            label: 'HERE Road Lite (Basemap)',
            type: 'raster',
            effects: { blend: true, shadow: false, outerGlow: false, innerGlow: false },
            defaults: { 'cv-blend-mode': 'normal' },
        },
    ]);

    addFpsCounter(map);
    addBaselineToggle(map, ['quakes-symbol']);
});
</script>
</body>
</html>
